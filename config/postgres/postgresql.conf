# =============================================================
# PostgreSQL Configuration — Tuned for Observability
# =============================================================
# This file is mounted into the PostgreSQL container at startup:
#   docker-compose volume mount → /etc/postgresql/postgresql.conf
#   Container command: postgres -c config_file=/etc/postgresql/postgresql.conf
#
# Worker 2 owns this file exclusively.
# =============================================================


# =============================================================
# SECTION 1: OBSERVABILITY SETTINGS
# =============================================================
# These are the MOST IMPORTANT settings for our project.
# Without them, Prometheus/Grafana can only see that PostgreSQL
# is running — not HOW it's performing internally.

# --- pg_stat_statements ---
# Tracks execution statistics (call count, total time, rows)
# for every distinct SQL statement. The postgres-exporter
# reads these stats and exposes them as Prometheus metrics.
# MUST be loaded at server startup — cannot be enabled with
# ALTER SYSTEM + pg_reload_conf() after the fact.
shared_preload_libraries = 'pg_stat_statements'

# Track ALL statements (including those inside functions).
# Default is 'top' which only tracks top-level statements.
pg_stat_statements.track = all

# --- Activity & I/O Tracking ---
# track_activities: Shows currently executing queries in
#   pg_stat_activity (useful for "what's running right now?" debugging)
track_activities = on

# track_counts: Counts table/index access operations.
#   Feeds pg_stat_user_tables and pg_stat_user_indexes views.
#   Without this, we can't see which tables are hot or which
#   indexes are actually being used.
track_counts = on

# track_io_timing: Measures wall-clock time spent on I/O
#   operations (reads/writes). Shows up in pg_stat_statements
#   as blk_read_time and blk_write_time columns.
#   Small overhead (~2-5%) but essential for diagnosing whether
#   slow queries are CPU-bound or I/O-bound.
track_io_timing = on

# track_functions: Track function call counts and timing.
#   'all' tracks both SQL and PL/pgSQL functions.
track_functions = all

# --- Slow Query Logging ---
# Log any statement that takes longer than 100ms.
# These show up in PostgreSQL's log files and help identify
# queries that might need optimization.
# Set to 0 to log ALL statements (very noisy).
# Set to -1 to disable (default).
log_min_duration_statement = 100


# =============================================================
# SECTION 2: CONNECTION SETTINGS
# =============================================================

# max_connections: Maximum simultaneous connections.
# The Go API sets SetMaxOpenConns(25) and SetMaxIdleConns(10).
# We also need connections for:
#   - postgres-exporter (monitoring)
#   - psql debugging sessions
#   - pgAdmin connections
#   - PostgreSQL's own background workers (~5)
# 100 provides comfortable headroom.
max_connections = 100

# listen_addresses: Accept connections from any IP.
# Required because the Go API connects from a different
# Docker container (not localhost).
listen_addresses = '*'


# =============================================================
# SECTION 3: MEMORY SETTINGS
# =============================================================
# PostgreSQL defaults are extremely conservative (designed to
# run on minimal hardware from 2005). Tuning these prevents
# artificially poor performance under load testing.

# shared_buffers: Main data cache in PostgreSQL.
# Rule of thumb: 25% of total RAM.
# Assuming ~1GB Docker container memory → 256MB.
# This is where frequently accessed table/index pages are cached.
shared_buffers = 256MB

# work_mem: Memory per sort/hash operation.
# Each ORDER BY, GROUP BY, or hash join gets this much memory.
# If exceeded, PostgreSQL spills to disk (much slower).
# Default is 4MB, which is reasonable for our workload.
# Caution: This is PER OPERATION, not per connection.
# With 25 connections doing sorts simultaneously = 25 × 4MB = 100MB.
work_mem = 4MB

# maintenance_work_mem: Memory for maintenance operations.
# Used by VACUUM, CREATE INDEX, ALTER TABLE ADD FK.
# Higher values make index creation faster (relevant during
# seed.sql execution when we CREATE INDEX on 500K rows).
maintenance_work_mem = 64MB


# =============================================================
# SECTION 4: WAL (Write-Ahead Log) SETTINGS
# =============================================================
# WAL ensures crash recovery — every change is written to the
# WAL before being applied to data files.

# wal_level: How much information is written to WAL.
# 'replica' enables point-in-time recovery and replication.
# Slightly more I/O than 'minimal' but standard practice.
wal_level = replica

# max_wal_size: Maximum WAL size before a checkpoint is forced.
# During bulk inserts (our 600K seed rows), PostgreSQL generates
# a lot of WAL. 1GB prevents excessive checkpoint frequency.
max_wal_size = 1GB

# min_wal_size: PostgreSQL recycles WAL files rather than
# deleting and recreating them. This keeps at least 80MB
# of WAL files around to avoid filesystem churn.
min_wal_size = 80MB


# =============================================================
# SECTION 5: LOGGING SETTINGS
# =============================================================
# Structured logging for debugging and post-mortem analysis.

# logging_collector: Capture stderr output into log files.
# Without this, logs go to Docker's stdout and may be lost.
logging_collector = on

# log_directory: Where log files are stored inside the container.
# Relative to the PostgreSQL data directory.
log_directory = 'pg_log'

# log_filename: Log file naming pattern with daily rotation.
log_filename = 'postgresql-%Y-%m-%d.log'

# log_statement: Which SQL statements to log.
# 'none' = don't log individual statements (too noisy with 5000 req/s).
# We rely on log_min_duration_statement = 100 above to catch slow ones.
# Options: none, ddl, mod, all
log_statement = 'none'

# log_line_prefix: Format of each log line.
# %m = timestamp with milliseconds
# %p = process ID
# %q = stop here for non-session processes
# %u = user name
# %d = database name
# Example output: 2024-01-15 10:30:45.123 [12345] perfobs@perfobs LOG: ...
log_line_prefix = '%m [%p] %q%u@%d '
