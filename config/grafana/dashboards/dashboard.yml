# =============================================================
# Grafana Dashboard Provisioning
# Worker 4: Orchestration
# =============================================================
# Tells Grafana where to find dashboard JSON files.
# Any .json file in the path below is auto-loaded on startup.
# =============================================================

apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: 'Performance Observatory'
    folderUid: 'perf-obs'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30     # Re-scan for new/updated JSON files
    allowUiUpdates: true          # Allow editing dashboards in the UI
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
