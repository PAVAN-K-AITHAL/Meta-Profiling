# =============================================================
# Performance Observatory — Docker Compose Stack
# Worker 4: Orchestration
# =============================================================
# Services: postgres, go-api, nginx, prometheus, grafana,
#           nginx-exporter, postgres-exporter
# All services join the `perf-net` bridge network.
# Start: docker compose up -d --build
# Stop:  docker compose down
# Wipe:  docker compose down -v   (removes volumes / seed data)
# =============================================================

services:

  # -----------------------------------------------------------
  # PostgreSQL 16 — Seeded with 100K users + 500K orders
  # -----------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: perf-postgres
    environment:
      POSTGRES_DB: perfobs
      POSTGRES_USER: perfobs
      POSTGRES_PASSWORD: perfobs
    # Load custom postgresql.conf tuned for observability
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    volumes:
      # Seed schema + data (runs only on first start with empty volume)
      - ./microservice/database/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      # Tuned observability config (pg_stat_statements, track_io_timing, etc.)
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      # Persist data between restarts (remove with `docker compose down -v` to re-seed)
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfobs -d perfobs"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s      # Give seeding time (600K rows ≈ 10-30s)
    networks:
      - perf-net
    restart: unless-stopped

  # -----------------------------------------------------------
  # Go REST API — Built from ./microservice/Dockerfile
  # -----------------------------------------------------------
  go-api:
    build:
      context: ./microservice
      dockerfile: Dockerfile
    container_name: perf-go-api
    pid: "host"                          # Share host PID namespace so `perf stat -p` can find threads
    cap_add:
      - SYS_PTRACE                       # Required for perf to trace the process
    environment:
      DATABASE_URL: postgres://perfobs:perfobs@postgres:5432/perfobs?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy   # Wait for full DB readiness, not just container start
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - perf-net
    restart: unless-stopped

  # -----------------------------------------------------------
  # Nginx 1.24 — Reverse proxy + stub_status for exporter
  # -----------------------------------------------------------
  nginx:
    image: nginx:1.24
    container_name: perf-nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      go-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/nginx_status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - perf-net
    restart: unless-stopped

  # -----------------------------------------------------------
  # Prometheus v2.52 — Scrapes go-api, nginx-exporter, postgres-exporter
  # -----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: perf-prometheus
    ports:
      - "9090:9090"
    volumes:
      # Mount entire prometheus config dir (prometheus.yml + alert_rules.yml)
      - ./config/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"        # Allows hot-reload: POST /-/reload
    depends_on:
      go-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - perf-net
    restart: unless-stopped

  # -----------------------------------------------------------
  # Grafana 11.0 — Auto-provisioned datasource + dashboards
  # -----------------------------------------------------------
  grafana:
    image: grafana/grafana:11.0.0
    container_name: perf-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/app_performance.json
    volumes:
      # Provisioning: datasources + dashboards auto-loaded on startup
      - ./config/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - perf-net
    restart: unless-stopped

  # -----------------------------------------------------------
  # Nginx Prometheus Exporter — Scrapes /nginx_status → :9113/metrics
  # -----------------------------------------------------------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1
    container_name: perf-nginx-exporter
    command:
      - "--nginx.scrape-uri=http://nginx/nginx_status"
    ports:
      - "9113:9113"
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - perf-net
    restart: unless-stopped

  # -----------------------------------------------------------
  # Postgres Exporter — Exposes pg_stat_* as Prometheus metrics
  # -----------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: perf-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://perfobs:perfobs@postgres:5432/perfobs?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - perf-net
    restart: unless-stopped

# =============================================================
# Volumes — Persist data across container restarts
# Use `docker compose down -v` to wipe and re-seed from scratch
# =============================================================
volumes:
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# =============================================================
# Networks — All services on a single bridge network
# =============================================================
networks:
  perf-net:
    driver: bridge
